<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTA · Curso de IA — 4Geeks</title>
<style>
  :root{
    color-scheme: light;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text", system-ui, Roboto, sans-serif;
    --blue:#2563eb; --blue-strong:#1d4ed8; --orange:#fb5a1f;
    --bg-outer:#eef2f9; --bg-outer-2:#e6ecf6; --card:#ffffff;
    --ink:#101828; --muted:#667085; --border:#e6e9f0; --ghost-border:#d7dded; --wa:#25d366;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--sans);color:var(--ink);
    background:radial-gradient(80% 60% at 90% -10%, color-mix(in srgb, var(--blue) 9%, transparent), transparent 60%),
      linear-gradient(160deg, var(--bg-outer) 0%, var(--bg-outer-2) 100%);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .stage{min-height:100%;display:grid;place-items:center;padding:clamp(18px,4vw,52px)}
  .cta{width:100%;max-width:860px;display:flex;align-items:center;justify-content:space-between;gap:22px;
    padding:22px 24px;border-radius:16px;background:var(--card);border:1px solid var(--border);
    box-shadow:0 16px 34px -24px rgba(28,54,120,.32), 0 3px 10px -8px rgba(28,54,120,.14);}
  .txt{min-width:0}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.71rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--orange)}
  .cta h3{margin:7px 0 5px;font-size:1.35rem;font-weight:800;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
  .cta h3 .hl{color:var(--orange)}
  .cta .sub{margin:0;font-size:.92rem;color:var(--muted);line-height:1.45}
  .actions{flex:0 0 auto;display:flex;align-items:center;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:.94rem;font-weight:700;line-height:1;white-space:nowrap;
    padding:12px 18px;border-radius:11px;text-decoration:none;cursor:pointer;border:1px solid transparent;
    transition:transform .12s ease, box-shadow .2s ease, filter .2s ease, border-color .16s ease, background .16s ease}
  .btn svg{transition:transform .18s ease}
  .btn.primary{color:#fff;background:linear-gradient(180deg,var(--blue) 0%, var(--blue-strong) 100%);
    box-shadow:0 12px 22px -12px color-mix(in srgb,var(--blue) 70%, transparent), inset 0 1px 0 rgba(255,255,255,.2)}
  .btn.primary:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 18px 30px -14px color-mix(in srgb,var(--blue) 72%, transparent), inset 0 1px 0 rgba(255,255,255,.2)}
  .btn.primary:hover svg{transform:translateX(3px)}
  .btn.primary:active{transform:translateY(0)}
  .btn.ghost{color:var(--ink);background:var(--card);border-color:var(--ghost-border)}
  .btn.ghost:hover{border-color:color-mix(in srgb,var(--blue) 45%, var(--ghost-border));background:color-mix(in srgb,var(--blue) 4%, var(--card))}
  .btn.ghost .wa{color:var(--wa)}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 22%, transparent)}
  @media (prefers-reduced-motion:reduce){.btn,.btn svg{transition:none}}
  @media (max-width:720px){.cta{flex-direction:column;align-items:flex-start;gap:16px}.actions{width:100%;flex-wrap:wrap}.actions .btn{flex:1 1 auto}}
</style>
</head>
<body>
<div class="stage">
  <div class="cta">
    <div class="txt">
      <span class="eyebrow"><span class="dot"></span> Curso · IA aplicada</span>
      <h3>Domina la <span class="hl">IA</span> en 8 semanas</h3>
      <p class="sub">De prompts a agentes y RAG en producción. Empieza aunque no sepas programar.</p>
    </div>
    <div class="actions">
      <a class="btn primary" href="guia-captacion-ia.html">Reservar mi plaza
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a class="btn ghost" href="guia-captacion-ia.html">Ver plan de estudios</a>
    </div>
  </div>
</div>
</body>
</html>
