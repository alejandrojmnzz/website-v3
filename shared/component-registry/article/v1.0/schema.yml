name: Article
version: "1.0"
component: Article
file: client/src/components/Article.tsx
description: Renders formatted markdown content with an optional auto-generated table of contents (top or sticky side)
when_to_use: |
  Use for long-form content pages such as blog posts, documentation, terms of service,
  privacy policies, or any rich text content that benefits from structured headings
  and optional navigation via a table of contents.

  IMPORTANT — splitting an article around a mid-page CTA (or any other section):
  Prefer two (or more) `article` sections on the same page rather than one giant block.
  Before adding a second article, ask the user whether they should share one table of
  contents. If yes, set the same `toc_group` on every article (e.g. `group_123456789`),
  with `show_toc: true` only on the first article in page order and `show_toc: false`
  on the rest. See example `article_split_toc_group`. If they should stay separate,
  omit `toc_group`.
props:
  variant:
    type: string
    required: false
    options:
      - default
  content:
    type: string
    required: true
    description: Markdown content for the article body
    example: |-
      # Welcome

      This is an example article with **bold** and *italic* text.
  show_toc:
    type: boolean
    required: false
    description: Whether to show the auto-generated table of contents (based on h1, h2, h3 headings)
  toc_position:
    type: string
    required: false
    options:
      - top
      - side
    description: >
      Position of the table of contents. "top" renders the TOC above the article content. "side" renders the TOC as a
      sticky sidebar that follows the user's scroll position and highlights the active heading.
