name: FAQ Section
version: "1.0"
component: FAQSection
file: client/src/components/FAQSection.tsx
description: Collapsible accordion with frequently asked questions
when_to_use: |
  Use to address common objections and questions.
  Helps with SEO and reduces support inquiries.
behaviors:
  schema_org:
    handler: faq
    notes: Contributes FAQPage JSON-LD during SSR via server/schema-components.
  listing:
    source: dynamic_entries
    notes: Optional FAQ items from dynamic_entries / content type queries.
props:
  title:
    type: string
    required: true
    example: Frequently Asked Questions
  items:
    type: array
    required: false
    items:
      question:
        type: string
        required: true
        example: Do I need prior coding experience?
      answer:
        type: string
        required: true
        example: No prior experience is required. We start from the fundamentals.
      locations:
        type: string
        required: true
      related_features:
        type: string
        required: true
      priority:
        type: string
        required: true
    description: "Deprecated: Use related_features instead. Inline Q&A pairs as fallback only."
  related_features:
    type: array
    required: false
    items:
      type:
        type: string
        required: true
        options:
          - online-platform
          - mentors-and-teachers
          - price
          - career-support
          - content-and-syllabus
          - job-guarantee
          - full-stack
          - cybersecurity
          - data-science
          - applied-ai
          - ai-engineering
          - outcomes
          - scholarships
          - rigobot
          - learnpack
          - certification
    description: >-
      Select up to 3 topics to pull FAQs from centralized data. Sorted by match count and priority. Max 9 FAQs
      displayed.
    example:
      - career-support
      - job-guarantee
  item_overrides:
    type: object
    required: false
  cta:
    type: object
    required: false
    properties:
      text:
        type: string
        required: false
        example: Still have questions?
      button:
        type: object
        required: false
        properties:
          label:
            type: string
            required: true
            example: Talk to an Advisor
          url:
            type: string
            required: true
            example: /contact
    description: Optional call-to-action section below the FAQ accordion. Only shown if at least text or button is provided.
