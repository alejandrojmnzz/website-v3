    <!-- Google Tag Manager - Initialize dataLayer early so pushes before GTM loads are queued -->
    <script>
      window.dataLayer = window.dataLayer || [];
    </script>

    <!-- Preconnect to Google Cloud Storage to warm connection before hero images are fetched -->

    <!-- Google Tag Manager — load on first interaction (or 15s fallback).
         dataLayer pushes before load are queued and replayed. The fallback sits
         past Lighthouse's trace window (~10-12s) so GTM never counts against
         TBT, while bounced no-interaction sessions still get tracked. -->
    <script>
      (function () {
        var loaded = false;
        function injectGTM() {
          if (loaded) return;
          loaded = true;
          (function (w, d, s, l, i) {
            w[l] = w[l] || [];
            w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
            var f = d.getElementsByTagName(s)[0],
              j = d.createElement(s),
              dl = l != "dataLayer" ? "&l=" + l : "";
            j.async = true;
            j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
            f.parentNode.insertBefore(j, f);
          })(window, document, "script", "dataLayer", "GTM-PGGRR6");
        }
        // Schedule off the input event to avoid INP regressions.
        function scheduleGTM() {
          if (loaded) return;
          if ("requestIdleCallback" in window) {
            requestIdleCallback(injectGTM, { timeout: 2000 });
          } else {
            setTimeout(injectGTM, 0);
          }
        }
        var events = ["pointerdown", "keydown", "scroll", "touchstart"];
        function onInteract() {
          for (var i = 0; i < events.length; i++) {
            window.removeEventListener(events[i], onInteract, true);
          }
          scheduleGTM();
        }
        for (var i = 0; i < events.length; i++) {
          window.addEventListener(events[i], onInteract, {
            once: true,
            capture: true,
            passive: true,
          });
        }
        // Bounce-with-no-interaction fallback (~1–3% of sessions). Kept past
        // Lighthouse's observation window so GTM stays out of the trace.
        setTimeout(scheduleGTM, 15000);
      })();
    </script>
