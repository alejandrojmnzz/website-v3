name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pack _WEBSITE_ runtime env
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python3 << 'PY'
          import base64
          import json
          import os

          prefix = "_WEBSITE_"
          secrets = json.loads(os.environ.get("SECRETS_JSON") or "{}")
          variables = json.loads(os.environ.get("VARS_JSON") or "{}")
          if not isinstance(secrets, dict):
              secrets = {}
          if not isinstance(variables, dict):
              variables = {}
          merged = dict(variables)
          merged.update(secrets)
          out = {}
          for key, value in merged.items():
              if not isinstance(key, str) or not key.startswith(prefix):
                  continue
              name = key[len(prefix) :]
              if not name or value is None or str(value) == "":
                  continue
              out[name] = str(value)
          packed = base64.b64encode(json.dumps(out, separators=(",", ":")).encode()).decode("ascii")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"WEBSITE_RUNTIME_B64={packed}\n")
          print("[runtime-env] packed", len(out), "keys:", ", ".join(sorted(out)) or "(none)")
          PY

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          WEBSITE_RUNTIME_B64: ${{ env.WEBSITE_RUNTIME_B64 }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/gha_deploy"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$KEY" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=50 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "export WEBSITE_RUNTIME_B64='${WEBSITE_RUNTIME_B64}'; bash -s" << 'REMOTE'
          set -euo pipefail
          cd /opt/website-v3
          git pull --ff-only
          python3 << 'PY'
          import base64
          import json
          import os
          from pathlib import Path

          dest = Path("/opt/website-v3/.env")
          b64 = (os.environ.get("WEBSITE_RUNTIME_B64") or "").strip()
          if not b64:
              print("[runtime-env] empty pack; leaving .env unchanged")
          else:
              data = json.loads(base64.b64decode(b64))
              if not data:
                  print("[runtime-env] no _WEBSITE_ keys; leaving .env unchanged")
              else:
                  def bash_assign(name, value):
                      return name + "=" + "'" + value.replace("'", "'\"'\"'") + "'"
                  text = "\n".join(bash_assign(k, data[k]) for k in sorted(data)) + "\n"
                  tmp = dest.with_name(".env.tmp")
                  tmp.write_text(text, encoding="utf-8")
                  os.chmod(tmp, 0o600)
                  os.replace(tmp, dest)
                  print("[runtime-env] wrote", dest, "keys:", ", ".join(sorted(data)))
          PY
          bash /opt/website-v3/scripts/deploy.sh
          git log -1 --oneline
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then
              curl -fsS http://127.0.0.1:5000/health
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy within 120s" >&2
          exit 1
          REMOTE
