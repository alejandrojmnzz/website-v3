name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (advisory)
        continue-on-error: true
        run: npm run check

      # sites.yml is gitignored; settings.ts loads it at import time.
      - name: Fixture sites.yml for tests
        run: cp sites.yml.example sites.yml

      - name: Unit tests
        run: npx vitest run
