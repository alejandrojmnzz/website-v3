name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Link @shared for tooling
        run: ln -sfn "$(pwd)/shared" node_modules/@shared

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npx vitest run

      - name: Prepare sites.yml for build
        run: cp .github/ci/sites.ci.yml sites.yml

      - name: Pull content for build
        env:
          GITHUB_TOKEN: ${{ secrets.CONTENT_GITHUB_TOKEN }}
        run: npm run content:pull -- --required

      - name: Production build
        run: npm run build
